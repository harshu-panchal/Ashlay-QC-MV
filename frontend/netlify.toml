# Netlify Configuration File for the frontend module
# This ensures successful deployment when Netlify's base directory is set to 'frontend' or when deploying the folder directly.

[build]
  command = "npm run build"
  publish = "dist"

# Redirects rule for single page application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and feature headers
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(self)"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
