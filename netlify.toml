# Root Netlify Configuration File
# This allows Netlify to automatically detect and build the frontend module from this monorepo.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Redirects rule for single page application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and feature headers
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(self)"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
